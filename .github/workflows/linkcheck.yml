---

name: Check documentation's hyperlinks

on:
  schedule:
    - cron: "41 2 5 */3 *"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.14"
      - run: pipx run hatch run docs:linkcheck

...
